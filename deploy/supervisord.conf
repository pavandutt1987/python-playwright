[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/studio-supervisor/supervisord.pid
childlogdir=/tmp/studio-supervisor

[program:display]
command=Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:window-manager]
command=/usr/local/bin/wait-display openbox
priority=20
autorestart=true
environment=HOME="/home/studio"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vnc]
command=/usr/local/bin/wait-display x11vnc -display :99 -localhost -rfbport 5900 -forever -shared -nopw
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:desktop-web]
command=websockify --web=/usr/share/novnc/ 6080 127.0.0.1:5900
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/usr/local/bin/wait-display python -m uvicorn app.server:app --host 0.0.0.0 --port 8000 --workers 1 --ws-max-size 262144
directory=/opt/studio
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
